<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="485" viewBox="0 0 1320 485" role="img" aria-labelledby="t d">
<title id="t">从一句话到真实行动</title><desc id="d">现有职责分工示意 · 不是统一语义层已经完成的声明</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#738ba5"/></marker></defs>
<rect width="1320" height="485" rx="20" fill="#0a1422"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="52" fill="#f5f8fc" font-size="29" font-weight="600">从一句话到真实行动</text>
<text x="40" y="89" fill="#a2b4cb" font-size="18" font-weight="400">现有职责分工示意 · 不是统一语义层已经完成的声明</text>
<rect x="40" y="145" width="280" height="174" rx="14" fill="#142236" stroke="#314358"/><rect x="40" y="160" width="4" height="28" rx="2" fill="#91baff"/><text x="62" y="181" fill="#91baff" font-size="22" font-weight="600">01  原始输入</text><text x="62" y="217" fill="#d9e3f5" font-size="18" font-weight="400">文字 / ASR 转写</text><text x="62" y="245" fill="#d9e3f5" font-size="18" font-weight="400">当前状态与请求上下文</text><text x="62" y="273" fill="#d9e3f5" font-size="18" font-weight="400">保留原文与约束</text><rect x="360" y="145" width="280" height="174" rx="14" fill="#142236" stroke="#314358"/><rect x="360" y="160" width="4" height="28" rx="2" fill="#91baff"/><text x="382" y="181" fill="#91baff" font-size="22" font-weight="600">02  理解与规划</text><text x="382" y="217" fill="#d9e3f5" font-size="18" font-weight="400">现有语义 / 视觉 / 任务入口</text><text x="382" y="245" fill="#d9e3f5" font-size="18" font-weight="400">意图契约与 Lua 编排</text><text x="382" y="273" fill="#d9e3f5" font-size="18" font-weight="400">候选计划不等于完成</text><rect x="680" y="145" width="280" height="174" rx="14" fill="#142236" stroke="#314358"/><rect x="680" y="160" width="4" height="28" rx="2" fill="#5ce0c1"/><text x="702" y="181" fill="#5ce0c1" font-size="22" font-weight="600">03  确定性执行</text><text x="702" y="217" fill="#d9e3f5" font-size="18" font-weight="400">参数、权限、实体、资源检查</text><text x="702" y="245" fill="#d9e3f5" font-size="18" font-weight="400">注册工具 → Unity 组件</text><text x="702" y="273" fill="#d9e3f5" font-size="18" font-weight="400">等待真实异步完成</text><rect x="1000" y="145" width="280" height="174" rx="14" fill="#142236" stroke="#314358"/><rect x="1000" y="160" width="4" height="28" rx="2" fill="#f0c57b"/><text x="1022" y="181" fill="#f0c57b" font-size="22" font-weight="600">04  真实反馈</text><text x="1022" y="217" fill="#d9e3f5" font-size="18" font-weight="400">状态与步骤回执</text><text x="1022" y="245" fill="#d9e3f5" font-size="18" font-weight="400">HUD / 结果回复 / TTS</text><text x="1022" y="273" fill="#d9e3f5" font-size="18" font-weight="400">失败与取消也进入结果</text><path d="M320,230 L353,230" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M640,230 L673,230" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M960,230 L993,230" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M1140,335 L1140,365 L820,365 L820,335" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><text x="180" y="407" fill="#d9e3f5" font-size="21" font-weight="400">模型负责提出与解释；实体、权限、可达性和完成状态由引擎核验。</text><text x="180" y="443" fill="#f0c57b" font-size="18" font-weight="400">现有入口仍有分散路由；统一前置语义层与 Jev 未接入。</text>
</g></svg>