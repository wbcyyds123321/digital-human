<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="515" viewBox="0 0 1320 515" role="img" aria-labelledby="t d">
<title id="t">场景资产怎样成为可交互世界</title><desc id="d">可见几何、逻辑数据与工具执行各司其职</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#738ba5"/></marker></defs>
<rect width="1320" height="515" rx="20" fill="#0a1422"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="52" fill="#f5f8fc" font-size="29" font-weight="600">场景资产怎样成为可交互世界</text>
<text x="40" y="89" fill="#a2b4cb" font-size="18" font-weight="400">可见几何、逻辑数据与工具执行各司其职</text>
<rect x="40" y="145" width="310" height="170" rx="14" fill="#142236" stroke="#314358"/><rect x="40" y="160" width="4" height="28" rx="2" fill="#5ce0c1"/><text x="62" y="181" fill="#5ce0c1" font-size="22" font-weight="600">MapGen 输出</text><text x="62" y="217" fill="#d9e3f5" font-size="18" font-weight="400">可见几何 / 材质</text><text x="62" y="245" fill="#d9e3f5" font-size="18" font-weight="400">对象与源几何归属</text><text x="62" y="273" fill="#d9e3f5" font-size="18" font-weight="400">导航、碰撞、高度、锚点</text><rect x="405" y="130" width="380" height="113" rx="14" fill="#142236" stroke="#314358"/><rect x="405" y="145" width="4" height="28" rx="2" fill="#91baff"/><text x="427" y="166" fill="#91baff" font-size="22" font-weight="600">空间与对象数据</text><text x="427" y="202" fill="#d9e3f5" font-size="18" font-weight="400">WorldData / 实体目录</text><text x="427" y="230" fill="#d9e3f5" font-size="18" font-weight="400">同一对象、地点与坐标参照</text><rect x="405" y="268" width="380" height="113" rx="14" fill="#142236" stroke="#314358"/><rect x="405" y="283" width="4" height="28" rx="2" fill="#91baff"/><text x="427" y="304" fill="#91baff" font-size="22" font-weight="600">表现资源</text><text x="427" y="340" fill="#d9e3f5" font-size="18" font-weight="400">合并网格服务于渲染</text><text x="427" y="368" fill="#d9e3f5" font-size="18" font-weight="400">源几何归属保留拾取身份</text><rect x="840" y="145" width="440" height="170" rx="14" fill="#142236" stroke="#314358"/><rect x="840" y="160" width="4" height="28" rx="2" fill="#5ce0c1"/><text x="862" y="181" fill="#5ce0c1" font-size="22" font-weight="600">Unity 角色使用</text><text x="862" y="217" fill="#d9e3f5" font-size="18" font-weight="400">导航图 A* / 合法接近点</text><text x="862" y="245" fill="#d9e3f5" font-size="18" font-weight="400">地面高度 / 实体能力检查</text><text x="862" y="273" fill="#d9e3f5" font-size="18" font-weight="400">HUD / 小地图 / 真实回执</text><path d="M350,226 L398,189" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M350,245 L398,322" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M785,189 L833,226" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M785,322 L833,250" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="440" fill="#f0c57b" font-size="22" font-weight="400">地图中存在一个模型，不自动意味着它可达、可坐或可驾驶。</text><text x="40" y="478" fill="#a2b4cb" font-size="18" font-weight="400">街区是本项目的交互环境；地图生成器的能力与素材独立介绍。</text>
</g></svg>