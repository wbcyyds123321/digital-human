<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="545" viewBox="0 0 1320 545" role="img" aria-labelledby="t d">
<title id="t">把图像定位与场景身份分开</title><desc id="d">旧帧负责初始绑定；新帧负责转动后的实际确认</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#738ba5"/></marker></defs>
<rect width="1320" height="545" rx="20" fill="#0a1422"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="52" fill="#f5f8fc" font-size="29" font-weight="600">把图像定位与场景身份分开</text>
<text x="40" y="89" fill="#a2b4cb" font-size="18" font-weight="400">旧帧负责初始绑定；新帧负责转动后的实际确认</text>
<rect x="40" y="135" width="390" height="132" rx="14" fill="#142236" stroke="#314358"/><rect x="40" y="150" width="4" height="28" rx="2" fill="#91baff"/><text x="62" y="171" fill="#91baff" font-size="22" font-weight="600">01  冻结观察帧</text><text x="62" y="207" fill="#d9e3f5" font-size="18" font-weight="400">RGB + ID + depth</text><text x="62" y="235" fill="#d9e3f5" font-size="18" font-weight="400">相机矩阵与帧标识</text><rect x="465" y="135" width="390" height="132" rx="14" fill="#142236" stroke="#314358"/><rect x="465" y="150" width="4" height="28" rx="2" fill="#91baff"/><text x="487" y="171" fill="#91baff" font-size="22" font-weight="600">02  语义定位</text><text x="487" y="207" fill="#d9e3f5" font-size="18" font-weight="400">只发送原 RGB 与描述</text><text x="487" y="235" fill="#d9e3f5" font-size="18" font-weight="400">模型输出二维点 / 框</text><rect x="890" y="135" width="390" height="132" rx="14" fill="#142236" stroke="#314358"/><rect x="890" y="150" width="4" height="28" rx="2" fill="#91baff"/><text x="912" y="171" fill="#91baff" font-size="22" font-weight="600">03  绑定实体</text><text x="912" y="207" fill="#d9e3f5" font-size="18" font-weight="400">查对应帧 ID / depth</text><text x="912" y="235" fill="#d9e3f5" font-size="18" font-weight="400">解析实体与表面点</text><path d="M430,200 L458,200" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M855,200 L883,200" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M1085,273 L1085,315" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><rect x="890" y="325" width="390" height="132" rx="14" fill="#142236" stroke="#314358"/><rect x="890" y="340" width="4" height="28" rx="2" fill="#5ce0c1"/><text x="912" y="361" fill="#5ce0c1" font-size="22" font-weight="600">04  真正转动 Eye</text><text x="912" y="397" fill="#d9e3f5" font-size="18" font-weight="400">改变实际观察姿态</text><text x="912" y="425" fill="#d9e3f5" font-size="18" font-weight="400">身体与可见头骨另行管理</text><rect x="465" y="325" width="390" height="132" rx="14" fill="#142236" stroke="#314358"/><rect x="465" y="340" width="4" height="28" rx="2" fill="#5ce0c1"/><text x="487" y="361" fill="#5ce0c1" font-size="22" font-weight="600">05  新帧中心确认</text><text x="487" y="397" fill="#d9e3f5" font-size="18" font-weight="400">抓取转动后的新画面</text><text x="487" y="425" fill="#d9e3f5" font-size="18" font-weight="400">中心 ID 与深度再次核对</text><rect x="40" y="325" width="390" height="132" rx="14" fill="#142236" stroke="#314358"/><rect x="40" y="340" width="4" height="28" rx="2" fill="#5ce0c1"/><text x="62" y="361" fill="#5ce0c1" font-size="22" font-weight="600">06  发布确认事实</text><text x="62" y="397" fill="#d9e3f5" font-size="18" font-weight="400">Broker / 任务目标引用</text><text x="62" y="425" fill="#d9e3f5" font-size="18" font-weight="400">高亮、坐标与后续工具</text><path d="M887,390 L862,390" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><path d="M462,390 L437,390" fill="none" stroke="#738ba5" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="507" fill="#f0c57b" font-size="21" font-weight="400">同帧绑定证明“实际命中谁”；是否符合用户描述仍需独立验证。</text>
</g></svg>