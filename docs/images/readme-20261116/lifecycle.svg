<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="525" viewBox="0 0 1320 525" role="img" aria-labelledby="t d">
<title id="t">行动与语音分别拥有生命周期</title><desc id="d">聊天、停止说话、暂停行动、取消任务需要各自的语义与资源范围</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#738ba5"/></marker></defs>
<rect width="1320" height="525" rx="20" fill="#0a1422"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="52" fill="#f5f8fc" font-size="29" font-weight="600">行动与语音分别拥有生命周期</text>
<text x="40" y="89" fill="#a2b4cb" font-size="18" font-weight="400">聊天、停止说话、暂停行动、取消任务需要各自的语义与资源范围</text>
<rect x="40" y="140" width="1220" height="98" rx="14" fill="#142236" stroke="#314358"/><rect x="40" y="155" width="4" height="28" rx="2" fill="#5ce0c1"/><text x="62" y="176" fill="#5ce0c1" font-size="22" font-weight="600">行动任务</text><text x="62" y="212" fill="#d9e3f5" font-size="18" font-weight="400">运行 → 挂起等待工具 → 收到当前任务回执 → 继续 / 完成</text><rect x="40" y="260" width="1220" height="98" rx="14" fill="#142236" stroke="#314358"/><rect x="40" y="275" width="4" height="28" rx="2" fill="#91baff"/><text x="62" y="296" fill="#91baff" font-size="22" font-weight="600">语音轮次</text><text x="62" y="332" fill="#d9e3f5" font-size="18" font-weight="400">排队 / 合成 → 开始期限检查 → 播放 → 完成或打断</text><rect x="40" y="380" width="585" height="111" rx="14" fill="#142236" stroke="#314358"/><rect x="40" y="395" width="4" height="28" rx="2" fill="#f0c57b"/><text x="62" y="416" fill="#f0c57b" font-size="22" font-weight="600">明确取消 / 替换</text><text x="62" y="452" fill="#d9e3f5" font-size="18" font-weight="400">停止对应行为，失效任务或轮次代次</text><text x="62" y="480" fill="#d9e3f5" font-size="18" font-weight="400">旧回调不再获得继续执行 / 播放资格</text><rect x="650" y="380" width="610" height="111" rx="14" fill="#142236" stroke="#314358"/><rect x="650" y="395" width="4" height="28" rx="2" fill="#f0c57b"/><text x="672" y="416" fill="#f0c57b" font-size="22" font-weight="600">持续核对的边界</text><text x="672" y="452" fill="#d9e3f5" font-size="18" font-weight="400">开始播放期限 ≠ 播放中的持续有效条件</text><text x="672" y="480" fill="#d9e3f5" font-size="18" font-weight="400">真实迟到 HTTP 回包仍是待验项</text>
</g></svg>